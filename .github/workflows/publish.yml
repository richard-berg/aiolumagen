name: Publish

# Publishes to PyPI with trusted publishing when a v* tag is pushed. Needs a
# trusted publisher on PyPI for this repository, this workflow file, and the
# `publish` environment.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: publish
      url: https://pypi.org/project/aiolumagen/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Check the tag matches the version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(uv version --short)
          module=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/aiolumagen/__init__.py)
          if [ "$TAG" != "v$version" ] || [ "$module" != "$version" ]; then
            echo "::error::Tag $TAG, pyproject.toml $version and __version__ $module must agree"
            exit 1
          fi

      - run: uv build --no-sources
      - run: uv publish
